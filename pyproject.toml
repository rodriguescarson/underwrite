[project]
name = "underwrite"
version = "0.1.0"
description = "The options agent that has to earn its own position size — calibration-gated autonomous options trading on Alpaca (MCP acts, CLI audits)."
requires-python = ">=3.12"
dependencies = [
  "google-adk>=2.7.1",
  "alpaca-py>=0.40",
  "mcp>=1.10,<2",
  "python-dotenv>=1.0",
  "rich>=13",
  "pydantic>=2",
  "streamlit>=1.40",
  "pandas>=2.2",
]

[project.scripts]
underwrite = "underwrite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwrite"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
